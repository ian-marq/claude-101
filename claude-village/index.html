<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3eee6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161b" media="(prefers-color-scheme: dark)">
<title>Claude Village</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #f3eee6; --fg: #2b2622; --muted: #8a8178; --faint: #b9b0a5;
    --card: #fffdf9; --line: rgba(60, 40, 20, .08); --shadow: 0 1px 2px rgba(60,40,20,.06), 0 8px 24px rgba(60,40,20,.08);
    --warn: #e5534b; --warn-bg: #fdecea; --ok: #2f9e6a; --ok-bg: #e6f5ec; --work: #d48a1f; --idle: #a39a90;
    --chip: #f1ebe2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161b; --fg: #ece8e2; --muted: #9a958e; --faint: #5d5953;
      --card: #1d2026; --line: rgba(255,255,255,.07); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
      --warn: #ff7a6e; --warn-bg: #3a2222; --ok: #5fd39a; --ok-bg: #1d3329; --work: #f0b44c; --idle: #7d7770; --chip: #262a31;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 14px/1.5 Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif;
         -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; letter-spacing: -0.01em; }

  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
           backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
           padding: max(14px, env(safe-area-inset-top)) 20px 12px; }
  .bar { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
  .brand svg { flex: none; }
  .brand h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
  .brand p { margin: 0; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px;
              border: 0; background: var(--card); color: var(--fg); font: inherit; font-size: 13px; box-shadow: var(--shadow); cursor: pointer; }
  .icon-btn svg { width: 16px; height: 16px; }
  .icon-btn.on { color: var(--work); }
  .live { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .live.ok { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 20%, transparent); }

  #waitlist { max-width: 1400px; margin: 10px auto 0; display: none; gap: 8px; flex-wrap: wrap; }
  #waitlist a { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--fg);
                text-decoration: none; font-size: 13px; cursor: pointer; max-width: 100%; }
  #waitlist a b { color: var(--warn); font-weight: 600; }
  #waitlist a span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  main { max-width: 1400px; margin: 0 auto; padding: 4px 20px 60px; }
  .section { display: flex; align-items: baseline; gap: 8px; margin: 22px 2px 12px; }
  .section h2 { font-size: 15px; font-weight: 700; margin: 0; }
  .section span { color: var(--muted); font-size: 13px; }
  .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); }
  .empty { color: var(--muted); padding: 22px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); font-size: 13.5px; }
  .empty code { background: var(--chip); padding: 2px 7px; border-radius: 6px; font-size: 12.5px; }

  .card { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; cursor: pointer;
          transition: transform .25s ease, box-shadow .25s ease; position: relative; }
  .card:hover { transform: translateY(-2px); }
  .card.waiting { box-shadow: 0 0 0 2px var(--warn), var(--shadow); }
  .scene { position: relative; aspect-ratio: 320 / 262; transition: background 2s ease; }
  .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .tag { position: absolute; top: 12px; left: 12px; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 600;
         background: rgba(255,255,255,.82); color: #3a332c; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: center; gap: 6px; }
  .tag i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .where { position: absolute; top: 12px; right: 12px; padding: 4px 9px; border-radius: 99px; font-size: 11.5px; color: #4a433c; background: rgba(255,255,255,.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .info { padding: 14px 16px 15px; }
  .name { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .name b { font-size: 15.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.02em; }
  .name span { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title { color: var(--muted); font-size: 13px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .act { margin-top: 10px; padding: 9px 11px; border-radius: 12px; background: var(--chip); font-size: 13px; display: flex; gap: 8px; align-items: center; min-height: 38px; }
  .act .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .act .txt em { font-style: normal; color: var(--muted); }
  .act.waiting { background: var(--warn-bg); } .act.waiting .txt { color: var(--warn); font-weight: 600; }
  .act.done { background: var(--ok-bg); } .act.done .txt { color: var(--ok); font-weight: 600; }
  .act svg { width: 16px; height: 16px; flex: none; }
  .stats { display: flex; align-items: center; gap: 14px; margin-top: 11px; color: var(--muted); font-size: 12.5px; }
  .stats .s { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .stats svg { width: 14px; height: 14px; opacity: .75; }
  .day { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
  .day .track { width: 54px; height: 4px; border-radius: 2px; background: var(--chip); overflow: hidden; }
  .day .track b { display: block; height: 100%; border-radius: 2px; transition: width 1s ease; }

  dialog { border: 0; padding: 0; background: var(--card); color: var(--fg); border-radius: 22px; width: min(480px, calc(100vw - 24px));
           max-height: min(80vh, 720px); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(20, 16, 12, .35); backdrop-filter: blur(3px); }
  @media (max-width: 600px) { dialog { margin: auto 0 0; width: 100vw; max-width: 100vw; border-radius: 22px 22px 0 0; padding-bottom: env(safe-area-inset-bottom); } }
  .sheet { padding: 20px 20px 22px; }
  .sheet h3 { margin: 0 34px 4px 0; font-size: 17px; letter-spacing: -0.02em; }
  .sheet .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .sheet .close { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 16px; border: 0; background: var(--chip); color: var(--fg); font-size: 16px; cursor: pointer; }
  .kv { display: grid; grid-template-columns: 84px 1fr; gap: 6px 10px; font-size: 13.5px; margin-bottom: 14px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-word; }
  .sheet h4 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 16px 0 6px; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .list div { padding: 8px 11px; border-radius: 10px; background: var(--chip); font-size: 13px; display: flex; gap: 8px; }
  .list div span { color: var(--muted); margin-left: auto; white-space: nowrap; }
  .sheet a { color: var(--work); }
  .sheet code { background: var(--chip); padding: 3px 7px; border-radius: 6px; font-size: 12.5px; word-break: break-all; }
  #qr { display: flex; justify-content: center; margin: 14px 0; } #qr svg { width: 210px; height: 210px; background: #fff; padding: 10px; border-radius: 14px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M17 6l13 7.5-13 7.5L4 13.5z" fill="#9fd07c"/><path d="M4 13.5l13 7.5v6L4 19.5z" fill="#b48057"/><path d="M30 13.5L17 21v6l13-7.5z" fill="#94643f"/><path d="M13 9.5l5 2.9v5.4l-5-2.9z" fill="#f4ede2"/><path d="M18 12.4l3-1.7v5.4l-3 1.7z" fill="#d9cfc0"/><path d="M12.4 9.2L15.5 5l5.4 5.6-2.9 1.7z" fill="#d86b4f"/></svg>
      <div style="min-width:0"><h1>Claude Village</h1><p id="summary">연결 중…</p></div>
    </div>
    <button class="icon-btn" id="phone" hidden title="폰으로 보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg><span>폰</span></button>
    <button class="icon-btn" id="bell" title="나를 기다리는 마을이 생기면 알림"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 003.4 0"/></svg></button>
    <span class="live" id="live" title="연결 상태"></span>
  </div>
  <div id="waitlist"></div>
</header>
<main>
  <div class="section"><h2>내 노트북</h2><span id="cLocal"></span></div>
  <div class="grid" id="gLocal"></div>
  <div class="section"><h2>클라우드</h2><span id="cCloud">claude.ai/code</span></div>
  <div class="grid" id="gCloud"></div>
</main>
<dialog id="dlg"><button class="close" id="dlgx" aria-label="닫기">✕</button><div class="sheet" id="dlgb"></div></dialog>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const W = 320, H = 262;
const TW = 34, TH = 17, N = 8, OX = W / 2, OY = 62, DEPTH = 16;

// ── 지도 (격자 좌표, x 는 오른쪽 아래, y 는 왼쪽 아래로) ─────────────────────
const BLD = {
  library: { x: 0, y: 1, w: 2, d: 2, stand: [1.0, 3.5], label: '도서관' },
  post:    { x: 2, y: 1, w: 1, d: 2, stand: [2.5, 3.5], label: '우체국' },
  hall:    { x: 4, y: 0, w: 2, d: 3, stand: [5.0, 3.5], label: '마을회관' },
  factory: { x: 6, y: 1, w: 2, d: 2, stand: [6.9, 3.5], label: '공장' },
  site:    { x: 1, y: 5, w: 2, d: 2, stand: [3.5, 5.9], label: '공사장' },
  inn:     { x: 5, y: 5, w: 2, d: 2, stand: [5.6, 7.5], label: '여관' },
};
const PLAZA = [3.5, 3.5], CORNER = [3.5, 7.5];
const isPath = (x, y) => y === 3 || x === 3 || (y === 7 && x >= 3);
const SLOTS = [[4,4],[5,4],[6,4],[7,4],[0,4],[1,4],[2,4],[4,5],[4,6],[7,5],[7,6],[0,5],[0,6],[0,7],[1,7],[2,7],[0,0],[1,0],[2,0],[6,0],[7,0],[3,0]].filter(([x, y]) => !isPath(x, y));
const ROOFS = ['#d86b4f', '#5b7fb5', '#8d6bb8', '#4f9a6f', '#d39a3a', '#c25d7e', '#3f9a9a', '#9a6b4a'];
const SHIRTS = ['#e07a52', '#5b8fd6', '#9b7be0', '#4fae7c', '#e06a8a', '#e3b341', '#40b5b5', '#c98a4f'];
const HAIRS = ['#3b2a20', '#6b4428', '#c79352', '#24242e', '#8a3a2e'];
const STATUS = { working: ['일하는 중', '#d48a1f'], waiting: ['응답 필요', '#e5534b'], done: ['완료', '#2f9e6a'], idle: ['쉬는 중', '#a39a90'], failed: ['실패', '#e5534b'] };

function hash(s) { let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }
const clip = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function shade(hex, f) { // f<0 어둡게, f>0 밝게
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const m = (c) => Math.round(f < 0 ? c * (1 + f) : c + (255 - c) * f);
  return `rgb(${m(r)},${m(g)},${m(b)})`;
}
const iso = (x, y, z = 0) => [OX + (x - y) * TW / 2, OY + (x + y) * TH / 2 - z];

// ── 시간대: 컨텍스트를 쓸수록 하루가 저문다 ─────────────────────────────────
function daytime(p) {
  if (p < .55) return { name: 'day', sky: ['#bfe3f5', '#e9f5fb'], overlay: null, night: 0 };
  if (p < .78) return { name: 'golden', sky: ['#f6cf9a', '#fbe9cf'], overlay: ['#ff9d4d', .16], night: 0 };
  if (p < .92) return { name: 'dusk', sky: ['#8f78b8', '#f1a587'], overlay: ['#6a4f9f', .32], night: .6 };
  return { name: 'night', sky: ['#1b2348', '#3a4b82'], overlay: ['#2a3a78', .5], night: 1 };
}

// ── 그리기 기본 ─────────────────────────────────────────────────────────────
function poly(g, pts, fill, stroke) {
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.closePath();
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = .6; g.stroke(); }
}
function circle(g, x, y, r, fill) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fillStyle = fill; g.fill(); }
function ellipse(g, x, y, rx, ry, fill) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fillStyle = fill; g.fill(); }

// 상자: 앞쪽 두 면 + 윗면
function box(g, x, y, w, d, h, z, color, opt = {}) {
  const top = opt.top || shade(color, .12), left = opt.left || color, right = opt.right || shade(color, -.16);
  const A = iso(x, y, z + h), B = iso(x + w, y, z + h), C = iso(x + w, y + d, z + h), D = iso(x, y + d, z + h);
  const Cb = iso(x + w, y + d, z), Db = iso(x, y + d, z), Bb = iso(x + w, y, z);
  poly(g, [D, C, Cb, Db], left);
  poly(g, [B, C, Cb, Bb], right);
  if (!opt.noTop) poly(g, [A, B, C, D], top);
}
// 앞-왼쪽 면(y = y+d 평면) 위 사각형: u = x 방향, v = 높이
function faceL(x, y, d, z, u0, u1, v0, v1) { const yy = y + d; return [iso(x + u0, yy, z + v0), iso(x + u1, yy, z + v0), iso(x + u1, yy, z + v1), iso(x + u0, yy, z + v1)]; }
// 앞-오른쪽 면(x = x+w 평면) 위 사각형: u = y 방향
function faceR(x, y, w, z, u0, u1, v0, v1) { const xx = x + w; return [iso(xx, y + u0, z + v0), iso(xx, y + u1, z + v0), iso(xx, y + u1, z + v1), iso(xx, y + u0, z + v1)]; }
// 박공 지붕 (용마루가 x 방향)
function gableX(g, x, y, w, d, z, rh, color, wall) {
  const R1 = iso(x - .08, y + d / 2, z + rh), R2 = iso(x + w + .08, y + d / 2, z + rh);
  const D = iso(x - .08, y + d + .1, z - 1), C = iso(x + w + .08, y + d + .1, z - 1), B = iso(x + w + .08, y - .1, z - 1);
  poly(g, [iso(x + w, y, z), iso(x + w, y + d, z), iso(x + w, y + d / 2, z + rh)], shade(wall, -.2)); // 박공벽
  poly(g, [D, C, R2, R1], color);
  poly(g, [B, iso(x + w + .08, y + d / 2, z + rh), C], shade(color, -.3));
  g.strokeStyle = shade(color, .25); g.lineWidth = 1; g.beginPath(); g.moveTo(R1[0], R1[1]); g.lineTo(R2[0], R2[1]); g.stroke();
}
// 박공 지붕 (용마루가 y 방향)
function gableY(g, x, y, w, d, z, rh, color, wall) {
  const R1 = iso(x + w / 2, y - .08, z + rh), R2 = iso(x + w / 2, y + d + .08, z + rh);
  poly(g, [iso(x, y + d, z), iso(x + w, y + d, z), iso(x + w / 2, y + d, z + rh)], shade(wall, .05)); // 박공벽
  const B = iso(x + w + .1, y - .08, z - 1), C = iso(x + w + .1, y + d + .08, z - 1);
  poly(g, [B, C, R2, R1], shade(color, -.18));
  poly(g, [iso(x - .1, y + d + .08, z - 1), C, R2], color);
}
// 피라미드 지붕
function hip(g, x, y, w, d, z, rh, color) {
  const P = iso(x + w / 2, y + d / 2, z + rh), D = iso(x - .1, y + d + .1, z), C = iso(x + w + .1, y + d + .1, z), B = iso(x + w + .1, y - .1, z);
  poly(g, [D, C, P], color); poly(g, [B, C, P], shade(color, -.22));
}

// ── 마을 하나 ───────────────────────────────────────────────────────────────
class Village {
  constructor(v) {
    this.id = v.id; this.h = hash(v.id);
    this.el = document.createElement('article'); this.el.className = 'card';
    this.el.innerHTML = `<div class="scene"><canvas></canvas><div class="tag"><i></i><span></span></div><div class="where"></div></div>
      <div class="info"><div class="name"><b></b><span></span></div><div class="title"></div><div class="act"><span class="ico"></span><span class="txt"></span></div><div class="stats"></div></div>`;
    this.cv = this.el.querySelector('canvas'); this.g = this.cv.getContext('2d');
    this.el.onclick = () => openDetail(this.id);
    this.mayor = { x: BLD.inn.stand[0], y: BLD.inn.stand[1], path: [], dir: 1 };
    this.kids = new Map(); this.fx = []; this.seenFx = new Set(); this.houseAt = new Map(); this.first = true;
    this.trees = SLOTS.map((s, i) => (hash(v.id + i) % 5) < 2);
    this.update(v);
  }

  update(v) {
    this.v = v;
    const [slabel, scolor] = STATUS[v.status] || STATUS.idle;
    this.el.className = 'card ' + v.status;
    const pct = v.ctx ? v.ctx.pct : .2;
    const dt = daytime(pct);
    this.el.querySelector('.scene').style.background = `linear-gradient(180deg, ${dt.sky[0]} 0%, ${dt.sky[1]} 70%)`;
    const tag = this.el.querySelector('.tag');
    tag.querySelector('i').style.background = scolor; tag.querySelector('span').textContent = slabel;
    this.el.querySelector('.where').textContent = v.where === 'cloud' ? '☁ 클라우드' : '노트북';
    this.el.querySelector('.name b').textContent = v.name;
    this.el.querySelector('.name span').textContent = v.branch || '';
    this.el.querySelector('.title').textContent = v.title;
    const act = this.el.querySelector('.act');
    act.className = 'act ' + v.status;
    act.querySelector('.ico').innerHTML = ICONS[v.status === 'working' ? v.building : v.status] || ICONS.idle;
    act.querySelector('.txt').innerHTML = activityText(v);
    const kids = v.students.filter((s) => !s.done).length;
    const barColor = pct > .9 ? '#e5534b' : pct > .75 ? '#e08a3c' : '#5fb98a';
    this.el.querySelector('.stats').innerHTML =
      `<span class="s" title="고친 파일 = 집">${ICONS.house}${v.stats.files}</span>`
      + `<span class="s" title="일하는 서브에이전트 = 학생">${ICONS.cap}${kids}</span>`
      + (v.stats.commits ? `<span class="s" title="커밋">${ICONS.commit}${v.stats.commits}</span>` : '')
      + (v.stats.prs ? `<span class="s" title="PR">${ICONS.pr}${v.stats.prs}</span>` : '')

  cap: sv('<path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>'),
  commit: sv('<circle cx="12" cy="12" r="3.5"/><path d="M2 12h6.5M15.5 12H22"/>'),
  pr: sv('<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7M18 15.5V9a2 2 0 00-2-2h-4"/>'),
};

// ── 화면 ───────────────────────────────────────────────────────────────────
const villages = new Map();
let data = { villages: [], cloud: {} };
const rank = { waiting: 0, working: 1, done: 2, failed: 2, idle: 3 };

function render() {
  const vs = data.villages, ids = new Set(vs.map((v) => v.id));
  for (const [id, vv] of villages) if (!ids.has(id)) { vv.el.remove(); villages.delete(id); }
  for (const v of vs) { const vv = villages.get(v.id); if (vv) vv.update(v); else villages.set(v.id, new Village(v)); }
  for (const where of ['local', 'cloud']) {
    const grid = where === 'local' ? gLocal : gCloud;
    const list = vs.filter((v) => v.where === where).sort((a, b) => (rank[a.status] - rank[b.status]) || (b.lastAt - a.lastAt));
    if (!list.length) {
      const msg = where === 'local' ? '최근 6시간 안에 열린 로컬 세션이 없어요.'
        : !data.cloud.enabled ? '클라우드 세션도 보려면 <code>node server.js --cloud</code>로 실행하세요.'
        : data.cloud.error ? esc(data.cloud.error) : '최근 클라우드 세션이 없어요.';
      if (grid.dataset.msg !== msg) { grid.innerHTML = `<div class="empty">${msg}</div>`; grid.dataset.msg = msg; }
    } else {
      grid.dataset.msg = ''; grid.querySelector('.empty')?.remove();
      list.forEach((v, i) => { const el = villages.get(v.id).el; if (grid.children[i] !== el) grid.insertBefore(el, grid.children[i] || null); });
    }
  }
  hud();
  if (dlg.open && dlg.dataset.id) openDetail(dlg.dataset.id, true);
}

let lastFrame = 0;
function loop(t) {
  if (t - lastFrame > 30) { // 약 30fps 로 충분
    lastFrame = t;
    for (const vv of villages.values()) { const r = vv.cv.getBoundingClientRect(); if (r.bottom > -50 && r.top < innerHeight + 50) vv.draw(t); }
  }
  requestAnimationFrame(loop);
}

// ── 상단 / 알림 ─────────────────────────────────────────────────────────────
let notify = false; try { notify = localStorage.getItem('cv-notify') === '1'; } catch {}
const paintBell = () => bell.classList.toggle('on', notify);
paintBell();
bell.onclick = async () => {
  notify = !notify;
  if (notify && 'Notification' in window && Notification.permission === 'default') { try { await Notification.requestPermission(); } catch {} }
  try { localStorage.setItem('cv-notify', notify ? '1' : '0'); } catch {}
  paintBell(); if (notify) ding();
};
let actx;
function ding() {
  try {
    actx = actx || new AudioContext();
    [880, 1175].forEach((f, i) => { const o = actx.createOscillator(), v = actx.createGain(); o.type = 'sine'; o.frequency.value = f;
      const s = actx.currentTime + i * .14; v.gain.setValueAtTime(.0001, s); v.gain.exponentialRampToValueAtTime(.12, s + .02); v.gain.exponentialRampToValueAtTime(.0001, s + .35);
      o.connect(v).connect(actx.destination); o.start(s); o.stop(s + .4); });
  } catch {}
}
const seenWait = new Set(); let firstHud = true;
function hud() {
  const vs = data.villages, n = (f) => vs.filter(f).length;
  const waiting = vs.filter((v) => v.status === 'waiting');
  const kids = vs.reduce((a, v) => a + v.students.filter((s) => !s.done).length, 0);
  const parts = [`마을 ${vs.length}곳`];
  if (n((v) => v.status === 'working')) parts.push(`${n((v) => v.status === 'working')}곳 일하는 중`);
  if (waiting.length) parts.push(`${waiting.length}곳이 기다려요`);
  if (kids) parts.push(`학생 ${kids}명`);
  summary.textContent = parts.join(' · ');
  cLocal.textContent = `${n((v) => v.where === 'local')}곳`;
  cCloud.textContent = data.cloud.enabled ? `${n((v) => v.where === 'cloud')}곳 · claude.ai/code` : 'claude.ai/code';
  document.title = (waiting.length ? `(${waiting.length}) ` : '') + 'Claude Village';
  waitlist.style.display = waiting.length ? 'flex' : 'none';
  waitlist.replaceChildren(...waiting.map((v) => {
    const a = document.createElement('a');
    a.innerHTML = `<b>${esc(clip(v.name, 18))}</b><span>${esc(clip(v.detail || v.note || v.title, 40))}</span>`;
    if (v.url) { a.href = v.url; a.target = '_blank'; a.rel = 'noopener'; } else a.onclick = () => openDetail(v.id);
    return a;
  }));
  for (const v of waiting) if (!seenWait.has(v.id)) {
    seenWait.add(v.id);
    if (!firstHud && notify) { ding(); try { if (Notification.permission === 'granted') new Notification(`${v.name} — 응답이 필요해요`, { body: v.detail || v.note || v.title }); } catch {} }
  }
  for (const id of [...seenWait]) if (!waiting.some((v) => v.id === id)) seenWait.delete(id);
  firstHud = false;
}

// ── 상세 시트 ───────────────────────────────────────────────────────────────
dlgx.onclick = () => dlg.close();
dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
function openDetail(id, refresh) {
  const v = data.villages.find((x) => x.id === id); if (!v) return;
  const ago = v.lastAt ? Math.round((Date.now() - v.lastAt) / 1000) : null;
  const kids = v.students.filter((s) => !s.done);
  const kv = (k, val) => (val ? `<dt>${k}</dt><dd>${val}</dd>` : '');
  dlgb.innerHTML = `<h3>${esc(v.title)}</h3><div class="sub">${esc(v.name)}${v.repo && v.repo !== v.name ? ' · ' + esc(v.repo) : ''}${v.branch ? ' · ' + esc(v.branch) : ''}</div>`
    + `<dl class="kv">`
    + kv('상태', `<span style="color:${(STATUS[v.status] || STATUS.idle)[1]};font-weight:600">${(STATUS[v.status] || STATUS.idle)[0]}</span>`)
    + kv('지금', activityText(v))
    + kv('컨텍스트', v.ctx ? `${Math.round(v.ctx.used / 1000)}k / ${Math.round(v.ctx.max / 1000)}k (${Math.round(v.ctx.pct * 100)}%)` : '')
    + kv('기록', `파일 ${v.stats.files}개 · 수정 ${v.stats.edits} · 커밋 ${v.stats.commits} · 푸시 ${v.stats.pushes} · PR ${v.stats.prs}`)
    + kv('마지막 활동', ago != null ? (ago < 60 ? `${ago}초 전` : ago < 3600 ? `${Math.round(ago / 60)}분 전` : `${Math.round(ago / 3600)}시간 전`) : '')
    + `</dl>`
    + (kids.length ? `<h4>학생 ${kids.length}명 (서브에이전트)</h4><div class="list">${kids.map((s) => `<div><b>${esc(s.type)}</b> ${esc(clip(s.desc, 30))}<span>${esc(BLD[s.building].label)}${s.tool ? ' · ' + esc(shortTool(s.tool)) : ''}</span></div>`).join('')}</div>` : '')
    + (v.houses.length ? `<h4>지은 집 ${v.houses.length}채 (고친 파일)</h4><div class="list">${v.houses.slice(-10).reverse().map((h) => `<div>${esc(h.name)}<span>${h.edits}번 수정</span></div>`).join('')}</div>` : '')
    + `<h4>이어서 하기</h4>`
    + (v.url ? `<a href="${esc(v.url)}" target="_blank" rel="noopener">claude.ai에서 열기 ↗</a>` : '')
    + (v.resume ? `<code>${esc(v.resume)}</code>` : '');
  dlg.dataset.id = id;
  if (!refresh) dlg.showModal();
}

// ── 폰으로 보기 (QR) ────────────────────────────────────────────────────────
fetch('/lan').then((r) => r.json()).then((j) => {
  if (!j.urls || !j.urls.length) return;
  phone.hidden = false;
  phone.onclick = async () => {
    dlg.dataset.id = '';
    const u = j.urls[0].url;
    dlgb.innerHTML = `<h3>폰으로 보기</h3><div class="sub">폰 카메라로 찍으세요. 노트북과 같은 와이파이(또는 Tailscale)에 있어야 해요.</div><div id="qr"></div><div class="list">`
      + j.urls.map((l) => `<div style="word-break:break-all">${esc(l.url)}<span>${l.tailscale ? 'Tailscale' : esc(l.ifname)}</span></div>`).join('')
      + `</div><div class="sub" style="margin-top:12px">이 주소에는 접속 토큰이 들어 있어요. 다른 사람과 공유하지 마세요.</div>`;
    dlg.showModal();
    try {
      if (!window.qrcode) await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
      const q = qrcode(0, 'M'); q.addData(u); q.make(); $('qr').innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
    } catch { $('qr').textContent = 'QR을 불러오지 못했어요. 아래 주소를 폰에 직접 입력하세요.'; }
  };
}).catch(() => {});

// ── 데이터 ─────────────────────────────────────────────────────────────────
function connect() {
  const es = new EventSource('/events');
  es.onopen = () => live.classList.add('ok');
  es.onmessage = (e) => { data = JSON.parse(e.data); render(); };
  es.onerror = () => { live.classList.remove('ok'); summary.textContent = '다시 연결하는 중…'; };
}
connect(); requestAnimationFrame(loop);
</script>
</body>
</html>
