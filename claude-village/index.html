<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#11172a">
<title>Claude Village</title>
<style>
  :root { --bg:#11172a; --fg:#eef1f8; --dim:#8d96ab; --card:#1a2238; --line:#2b3553; --warn:#ff6b5e; --ok:#5fd38d; --work:#f5c451; --link:#8ab4ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; -webkit-text-size-adjust: 100%; }
  header { position: sticky; top: 0; z-index: 5; padding: 10px 16px 8px; padding-top: max(10px, env(safe-area-inset-top));
           background: rgba(17,23,42,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0; margin-right: auto; }
  .stats { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .pill { padding: 2px 8px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); white-space: nowrap; font-size: 12px; }
  .w { color: var(--work); } .x { color: var(--warn); } .o { color: var(--ok); }
  button { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; cursor: pointer; }
  #waitlist { display: none; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  #waitlist a { color: var(--fg); text-decoration: none; background: #3a1d22; border: 1px solid var(--warn); border-radius: 8px; padding: 3px 9px; cursor: pointer; }
  main { padding: 6px 16px 40px; max-width: 1500px; margin: 0 auto; }
  h2 { font-size: 13px; color: var(--dim); font-weight: 600; margin: 18px 2px 8px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
  .empty { color: var(--dim); padding: 14px; border: 1px dashed var(--line); border-radius: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; transition: border-color .2s; }
  .card.waiting { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn), 0 0 22px rgba(255,107,94,.25); }
  .card .hd { display: flex; align-items: center; gap: 8px; padding: 9px 12px 7px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
  .tt { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  canvas { display: block; width: 100%; aspect-ratio: 240 / 164; image-rendering: pixelated; image-rendering: crisp-edges; }
  .now { padding: 7px 12px; min-height: 32px; border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now.waiting { background: #3a1d22; color: #ffd9d4; } .now.done { background: #173326; color: #c9f5da; }
  .meta { display: flex; gap: 10px; padding: 0 12px 9px; color: var(--dim); font-size: 12px; flex-wrap: wrap; }
  .day { display: inline-flex; align-items: center; gap: 5px; }
  .day i { display: inline-block; width: 46px; height: 5px; border-radius: 3px; background: #0006; overflow: hidden; }
  .day i b { display: block; height: 100%; }
  dialog { background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 14px; max-width: min(520px, calc(100vw - 24px)); width: 100%; padding: 16px; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog h3 { margin: 0 0 8px; font-size: 15px; padding-right: 30px; }
  dialog .row { color: var(--dim); margin: 2px 0; } dialog .row span { color: var(--fg); }
  dialog ul { margin: 4px 0 8px; padding-left: 18px; } dialog li { margin: 1px 0; }
  dialog a { color: var(--link); word-break: break-all; }
  dialog .x { float: right; }
  code { background: #0005; padding: 1px 5px; border-radius: 4px; word-break: break-all; }
  #qr svg { width: 220px; height: 220px; background: #fff; padding: 8px; border-radius: 8px; display: block; margin: 8px auto; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>🏘 Claude Village</h1>
    <button id="phone" hidden>📱 폰으로 보기</button>
    <button id="bell">🔕 알림</button>
    <span id="conn" class="pill" style="color:var(--dim)">연결 중…</span>
  </div>
  <div class="stats">
    <span class="pill">💻 <b id="nLocal">0</b></span>
    <span class="pill">☁️ <b id="nCloud">0</b></span>
    <span class="pill w">🔨 일하는 중 <b id="nWork">0</b></span>
    <span class="pill x">❗ 나를 기다림 <b id="nWait">0</b></span>
    <span class="pill o">✔ 끝남 <b id="nDone">0</b></span>
    <span class="pill">🎓 학생 <b id="nStud">0</b></span>
  </div>
  <div id="waitlist"></div>
</header>
<main>
  <h2>💻 내 노트북의 마을들</h2>
  <div class="grid" id="gLocal"></div>
  <h2>☁️ 구름 위 마을들 (claude.ai/code)</h2>
  <div class="grid" id="gCloud"></div>
</main>
<dialog id="dlg"><button class="x" id="dlgx">✕</button><div id="dlgb"></div></dialog>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const W = 240, H = 164;
const ROAD_Y = 84;
// 건물 위치와 문 (논리 픽셀)
const B = {
  library: { x: 10,  y: 34, w: 54, h: 36, door: [37, 70],  label: '도서관' },
  hall:    { x: 96,  y: 24, w: 48, h: 46, door: [120, 70], label: '마을회관' },
  factory: { x: 174, y: 34, w: 58, h: 36, door: [190, 70], label: '공장' },
  post:    { x: 12,  y: 98, w: 42, h: 28, door: [33, 126], label: '우체국' },
  site:    { x: 90,  y: 94, w: 60, h: 34, door: [120, 128], label: '공사장' },
  inn:     { x: 184, y: 98, w: 46, h: 28, door: [207, 126], label: '여관' },
};
const ICON = { library: '📖', site: '🔨', factory: '⚙️', hall: '🏛', post: '📮', inn: '🛌' };
const STATUS = { working: ['일하는 중', '#f5c451'], waiting: ['나를 기다림', '#ff6b5e'], done: ['끝남', '#5fd38d'], idle: ['쉬는 중', '#8d96ab'], failed: ['실패', '#ff6b5e'] };
const SHIRT = ['#e8794a', '#5aa9e6', '#9b7be0', '#58c48b', '#e0607e', '#e6c14f', '#4fc7c7', '#c9874f'];
const ROOF = ['#c0503e', '#3e78c0', '#7a54b8', '#3f9a62', '#c08a2e', '#b8476e', '#2f9a9a', '#8a6a4a'];
const HAIR = ['#2b1d16', '#5b3a23', '#c98f4e', '#1e1e28', '#7a2f2f', '#d9d2c5'];

function hash(s) { let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }
const clip = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lerp = (a, b, t) => a + (b - a) * t;
function mix(c1, c2, t) {
  const p = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
  const a = p(c1), b = p(c2);
  return '#' + a.map((v, i) => Math.round(lerp(v, b[i], t)).toString(16).padStart(2, '0')).join('');
}

// ── 마을 하나 ───────────────────────────────────────────────────────────────
class Village {
  constructor(v) {
    this.id = v.id; this.h = hash(v.id);
    this.el = document.createElement('div'); this.el.className = 'card';
    this.el.innerHTML = `<div class="hd"><span class="dot"></span><span class="nm"></span><span class="tt"></span></div><canvas></canvas><div class="now"></div><div class="meta"></div>`;
    this.cv = this.el.querySelector('canvas'); this.g = this.cv.getContext('2d');
    this.el.onclick = () => openDetail(this.id);
    this.mayor = { x: B.inn.door[0], y: B.inn.door[1], path: [], dir: 1 };
    this.kids = new Map(); this.fx = []; this.seenFx = new Set(); this.houseAt = new Map(); this.first = true;
    this.update(v);
  }
  update(v) {
    this.v = v;
    const color = (STATUS[v.status] || STATUS.idle)[1];
    this.el.className = 'card ' + v.status;
    this.el.querySelector('.dot').style.background = color;
    this.el.querySelector('.nm').textContent = v.name;
    this.el.querySelector('.tt').textContent = v.title;
    const now = this.el.querySelector('.now');
    now.className = 'now ' + v.status;
    const kidsActive = v.students.filter((s) => !s.done);
    now.textContent = v.status === 'waiting' ? `❗ ${v.detail || v.note || '내 차례를 기다리는 중'}`
      : v.status === 'done' ? `✔ ${v.detail || v.note || '끝났어요. 확인해 주세요'}`
      : v.status === 'working' ? `${ICON[v.building]} ${B[v.building].label} · ${shortTool(v.tool)} ${v.detail || ''}${kidsActive.length ? `  · 🎓×${kidsActive.length}` : ''}`
      : '🛌 여관에서 쉬는 중';
    const pct = v.ctx ? v.ctx.pct : 0;
    this.el.querySelector('.meta').innerHTML =
      `<span class="day" title="컨텍스트 사용량 = 하루가 저무는 정도">${timeIcon(pct)} <i><b style="width:${pct * 100}%;background:${pct > .85 ? '#ff6b5e' : pct > .6 ? '#f5a35a' : '#5fd38d'}"></b></i></span>`
      + `<span>🏠 ${v.stats.files}</span><span>🎓 ${kidsActive.length}</span>`
      + (v.stats.commits ? `<span>🎆 ${v.stats.commits}</span>` : '') + (v.stats.pushes ? `<span>🎈 ${v.stats.pushes}</span>` : '')
      + (v.stats.prs ? `<span>🚩 PR ${v.stats.prs}</span>` : '')
      + `<span>${v.where === 'cloud' ? '☁️' : '💻'} ${esc(clip(v.repo, 22))}${v.branch ? ' · ' + esc(clip(v.branch, 18)) : ''}</span>`;
    // 새 집 (팝업 애니메이션용)
    for (const h of v.houses) if (!this.houseAt.has(h.path)) this.houseAt.set(h.path, this.first ? 0 : performance.now());
    // 이벤트 효과 (최근 것만)
    for (const e of v.effects) {
      if (this.seenFx.has(e.id)) continue;
      this.seenFx.add(e.id);
      if (!this.first && Date.now() - e.at < 15000) this.fx.push({ kind: e.kind, t0: performance.now(), seed: e.id });
    }
    // 학생 등장/퇴장
    for (const s of v.students) {
      let k = this.kids.get(s.id);
      if (!k) { k = { x: B.hall.door[0], y: B.hall.door[1], path: [], dir: 1, h: hash(s.id), target: null, alpha: 0 }; this.kids.set(s.id, k); }
      k.s = s; k.gone = false;
    }
    for (const [id, k] of this.kids) if (!v.students.some((s) => s.id === id)) k.gone = true;
    this.first = false;
  }

  // 광장 길을 따라 문까지 걷게
  route(a, door, spread) {
    const tx = door[0] + spread, ty = door[1];
    if (a.target && a.target[0] === tx && a.target[1] === ty) return;
    a.target = [tx, ty];
    a.path = Math.abs(a.y - ty) < 2 ? [[tx, ty]] : [[a.x, ROAD_Y], [tx, ROAD_Y], [tx, ty]];
  }
  step(a, speed) {
    const p = a.path[0];
    if (!p) return false;
    const dx = p[0] - a.x, dy = p[1] - a.y, d = Math.hypot(dx, dy);
    if (d <= speed) { a.x = p[0]; a.y = p[1]; a.path.shift(); return a.path.length > 0; }
    a.x += dx / d * speed; a.y += dy / d * speed; if (Math.abs(dx) > .3) a.dir = Math.sign(dx);
    return true;
  }

  draw(t) {
    const v = this.v, g = this.g;
    const css = this.cv.clientWidth || 340, dpr = window.devicePixelRatio || 1;
    const k = Math.max(1, Math.round(css * dpr / W));
    if (this.cv.width !== W * k) { this.cv.width = W * k; this.cv.height = H * k; }
    g.setTransform(k, 0, 0, k, 0, 0); g.imageSmoothingEnabled = false;
    const pct = v.ctx ? v.ctx.pct : 0.15;
    const working = v.status === 'working';
    const kidsAt = {};
    for (const kd of this.kids.values()) if (!kd.gone && !kd.s.done) kidsAt[kd.s.building] = (kidsAt[kd.s.building] || 0) + 1;
    const active = (b) => (working && v.building === b) || kidsAt[b] > 0;

    sky(g, t, pct, this.h);
    ground(g, t, v.where === 'cloud', this.h);
    library(g, t, active('library'));
    hall(g, t, v.status, this.h);
    factory(g, t, active('factory'), this.fx.some((f) => f.kind === 'boom' && t - f.t0 < 2500));
    post(g, t, active('post'));
    site(g, t, active('site'), v.stats.edits, this.h);
    inn(g, t, v.status === 'idle');
    fountain(g, t);
    houses(g, t, v.houses, this.houseAt);

    // 촌장 (메인 Claude)
    const m = this.mayor;
    this.route(m, (B[v.building] || B.inn).door, 0);
    const walking = this.step(m, 1.1) || m.path.length > 0;
    if (!(v.building === 'inn' && !walking)) { // 여관에 들어가면 안 보임
      const mode = walking ? 'walk' : v.status === 'waiting' ? 'wave' : v.status === 'done' ? 'cheer' : working ? 'work' : 'stand';
      person(g, m.x - 3, m.y, SHIRT[this.h % 8], HAIR[(this.h >> 3) % 6], t, mode, m.dir, 1, ROOF[this.h % 8]);
      if (v.status === 'waiting') text(g, '!', m.x, m.y - 24 - ((t / 250 | 0) % 2), '#ff3b2f', 10, 'center');
      if (v.error) smoke(g, t, m.x, m.y - 16, '#888');
    }
    // 학생들 (서브에이전트)
    const idx = {};
    for (const [id, kd] of this.kids) {
      const s = kd.s, leaving = kd.gone || s.done;
      const b = leaving ? B.hall : (B[s.building] || B.site);
      const n = idx[s.building] = (idx[s.building] || 0) + 1;
      this.route(kd, b.door, leaving ? 0 : (n % 2 ? 1 : -1) * (6 + (n >> 1) * 6));
      const moving = this.step(kd, 0.9) || kd.path.length > 0;
      kd.alpha = leaving && !moving ? Math.max(0, kd.alpha - 0.02) : Math.min(1, kd.alpha + 0.05);
      if (leaving && kd.alpha <= 0) { this.kids.delete(id); continue; }
      g.globalAlpha = kd.alpha;
      person(g, kd.x - 2, kd.y + 2, SHIRT[kd.h % 8], HAIR[kd.h % 6], t + kd.h % 700, moving ? 'walk' : 'study', kd.dir, 0.65, null, true);
      g.globalAlpha = 1;
    }
    this.fx = this.fx.filter((f) => effectFx(g, t, f, this.h));
  }
}
function shortTool(t) { return !t ? '' : t.startsWith('mcp__') ? '🔌 ' + t.split('__').slice(1).join('.') : t; }
function timeIcon(p) { return p < .5 ? '☀️' : p < .8 ? '🌤' : p < .92 ? '🌇' : '🌙'; }

// ── 그리기 도구 ─────────────────────────────────────────────────────────────
function px(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); }
function text(g, s, x, y, c, size = 6, align = 'left') { g.fillStyle = c; g.font = `bold ${size}px ui-monospace, Menlo, monospace`; g.textAlign = align; g.textBaseline = 'top'; g.fillText(s, x, y); }
function circle(g, x, y, r, c) { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }

// 하늘: 컨텍스트를 쓸수록 해가 저문다
function sky(g, t, pct, h) {
  const stops = [[0, '#7cc4f2', '#cdeefc'], [.5, '#6fb5ea', '#bfe6f7'], [.75, '#e9a15e', '#f7d6a0'], [.9, '#6a4a8c', '#e98a6a'], [1, '#0e1638', '#2c3d74']];
  let i = 0; while (i < stops.length - 2 && pct > stops[i + 1][0]) i++;
  const [p0, a0, b0] = stops[i], [p1, a1, b1] = stops[i + 1];
  const k = Math.max(0, Math.min(1, (pct - p0) / (p1 - p0)));
  const grd = g.createLinearGradient(0, 0, 0, 60);
  grd.addColorStop(0, mix(a0, a1, k)); grd.addColorStop(1, mix(b0, b1, k));
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  const sx = lerp(18, 222, Math.min(1, pct / .92)), sy = 18 + Math.pow((sx - 120) / 102, 2) * 14 - 2;
  if (pct < .92) { circle(g, sx, sy, 8, 'rgba(255,226,122,.25)'); circle(g, sx, sy, 6, pct > .75 ? '#ffb15a' : '#ffe27a'); }
  else { circle(g, 200, 14, 5, '#f4f1d6'); circle(g, 202, 12, 5, '#1d2a55'); for (let i = 0; i < 18; i++) { const r = hash('st' + i); if ((t / 700 + i) % 5 > .5) px(g, r % W, (r >> 8) % 30, 1, 1, '#fff'); } }
  for (let i = 0; i < 2; i++) { const x = ((hash('cl' + h + i) % W) + t / (140 + i * 60)) % (W + 40) - 30; cloudPuff(g, x, 8 + i * 9, 22, .75); }
}
function cloudPuff(g, x, y, w, a = 1) { g.globalAlpha = a; for (let i = 0; i <= w; i += 6) circle(g, x + i, y + Math.sin(i) * 1.5, 4 + (i % 12 === 0 ? 2 : 0), '#fff'); g.globalAlpha = 1; }

function ground(g, t, cloudy, h) {
  const top = 30;
  if (cloudy) { // 하늘에 떠 있는 섬
    px(g, 4, H - 10, W - 8, 6, '#8a7357'); px(g, 14, H - 5, W - 28, 4, '#6d5a43'); px(g, 40, H - 2, W - 80, 2, '#57472f');
    g.fillStyle = '#6fbf57'; g.beginPath(); g.roundRect ? g.roundRect(4, top, W - 8, H - top - 8, 10) : g.rect(4, top, W - 8, H - top - 8); g.fill();
  } else px(g, 0, top, W, H - top, '#6fbf57');
  for (let i = 0; i < 40; i++) { const r = hash('gr' + h + i); px(g, 8 + r % (W - 16), top + 4 + (r >> 9) % (H - top - 14), 1, 2, '#58a545'); }
  px(g, 8, ROAD_Y - 4, W - 16, 9, '#d9c49a'); px(g, 116, 68, 9, ROAD_Y - 68, '#d9c49a'); px(g, 116, ROAD_Y, 9, 46, '#d9c49a');
  for (const k of ['library', 'factory', 'post', 'inn']) { const d = B[k].door; const y0 = Math.min(d[1], ROAD_Y), y1 = Math.max(d[1], ROAD_Y); px(g, d[0] - 3, y0, 7, y1 - y0, '#d9c49a'); }
  if (cloudy) for (let i = 0; i < 5; i++) cloudPuff(g, ((i * 53 + t / 90) % (W + 40)) - 30, H - 3 + (i % 2) * 3, 26, .9);
}

function walls(g, b, wall, roof, roofH = 8) {
  px(g, b.x, b.y + roofH, b.w, b.h - roofH, wall);
  for (let i = 0; i < roofH; i++) px(g, b.x - 2 + i * 1.5, b.y + roofH - i, b.w + 4 - i * 3, 1, roof);
  px(g, b.door[0] - 3, b.door[1] - 9, 7, 9, '#6b4a2b'); px(g, b.door[0] + 2, b.door[1] - 5, 1, 1, '#e7c35a');
}
function windows(g, b, n, lit, t, y) {
  const gap = (b.w - 8) / n;
  for (let i = 0; i < n; i++) {
    const x = b.x + 4 + i * gap + gap / 2 - 4;
    if (Math.abs(x + 4 - b.door[0]) < 7) continue;
    if (lit) { g.globalAlpha = .3; px(g, x - 2, y - 2, 12, 11, '#ffe27a'); g.globalAlpha = 1; }
    px(g, x, y, 8, 7, lit ? ((t / 300 + i) % 6 < .3 ? '#ffd76a' : '#ffe9a0') : '#5b7290');
    px(g, x + 3.5, y, 1, 7, '#00000033');
  }
}
function library(g, t, on) {
  const b = B.library;
  walls(g, b, '#e9dcc4', '#7a4a8a');
  px(g, b.x + 2, b.y + 9, 2, b.h - 9, '#d6c6a8'); px(g, b.x + b.w - 4, b.y + 9, 2, b.h - 9, '#d6c6a8');
  windows(g, b, 4, on, t, b.y + 14);
  // 간판: 펼친 책
  px(g, b.x + b.w / 2 - 6, b.y + 1, 5, 4, '#fff'); px(g, b.x + b.w / 2, b.y + 1, 5, 4, '#fff'); px(g, b.x + b.w / 2 - 1, b.y + 1, 1, 4, '#7a4a8a');
  if (on) for (let i = 0; i < 3; i++) { // 책이 둥실둥실
    const p = ((t / 900 + i / 3) % 1); g.globalAlpha = 1 - p;
    px(g, b.x + 12 + i * 14 + Math.sin(p * 6 + i) * 3, b.y + 6 - p * 18, 4, 3, SHIRT[i * 2]); g.globalAlpha = 1;
  }
}
function hall(g, t, status, h) {
  const b = B.hall;
  walls(g, b, '#f1ead8', '#3e78c0', 10);
  px(g, b.x + b.w / 2 - 5, b.y - 6, 10, 9, '#d9cfb5'); px(g, b.x + b.w / 2 - 7, b.y - 9, 14, 3, '#3e78c0');
  const swing = status === 'waiting' ? Math.sin(t / 90) * 2.5 : 0;
  px(g, b.x + b.w / 2 - 2 + swing, b.y - 5, 5, 5, '#e7b83a');
  if (status === 'waiting' && (t / 200 | 0) % 2) { text(g, '♪', b.x + b.w / 2 + 8, b.y - 12, '#fff', 7); text(g, '♪', b.x + b.w / 2 - 14, b.y - 10, '#fff', 6); }
  // 깃발: 끝나면 초록 깃발이 올라감
  px(g, b.x + b.w + 3, b.y - 4, 1, 30, '#666');
  const fy = status === 'done' ? b.y - 4 : b.y + 18, wave = (t / 200 | 0) % 2;
  const fc = status === 'done' ? '#5fd38d' : status === 'waiting' ? '#ff6b5e' : ROOF[h % 8];
  px(g, b.x + b.w + 4, fy, 9, 6, fc); px(g, b.x + b.w + 12, fy + wave, 2, 5, fc);
  for (let i = 0; i < 4; i++) px(g, b.x + 6 + i * 12, b.y + 14, 3, b.h - 14, '#ddd3bb');
  windows(g, b, 2, status === 'waiting' || status === 'done', t, b.y + 18);
}
function factory(g, t, on, boom) {
  const b = B.factory;
  px(g, b.x, b.y + 10, b.w, b.h - 10, '#9aa3b5');
  for (let i = 0; i < 3; i++) for (let j = 0; j < 6; j++) px(g, b.x + i * 15 + j * 2.5, b.y + 9 - j, 3, j + 1, '#7d8699');
  px(g, b.x + b.w - 12, b.y - 12, 7, 22, '#a0522d'); px(g, b.x + b.w - 13, b.y - 13, 9, 2, '#7a3e22');
  px(g, b.door[0] - 4, b.door[1] - 11, 9, 11, '#4a5160');
  windows(g, { ...b, w: b.w - 14 }, 3, on, t, b.y + 15);
  if (on || boom) for (let i = 0; i < 4; i++) smokePuff(g, t, b.x + b.w - 9, b.y - 14, i, boom ? '#3a3a3a' : '#eeeeee');
  const cx = b.x + 44, cy = b.y + 27, a = on ? t / 250 : 0;
  for (let k = 0; k < 6; k++) px(g, cx + Math.cos(a + k) * 4 - 1, cy + Math.sin(a + k) * 4 - 1, 2, 2, '#4a5160');
  if (boom) { // 테스트/명령 실패
    const p = (t / 60) % 6;
    for (let i = 0; i < 8; i++) { const ang = i / 8 * Math.PI * 2; px(g, b.x + 20 + Math.cos(ang) * (4 + p * 2), b.y + 4 + Math.sin(ang) * (4 + p * 2), 2, 2, i % 2 ? '#ff5a2a' : '#ffd23a'); }
  }
}
function smokePuff(g, t, x, y, i, c) {
  const p = ((t / 1400) + i / 4) % 1;
  g.globalAlpha = .8 * (1 - p); circle(g, x + p * 14 + Math.sin(p * 5 + i) * 2, y - p * 22, 2 + p * 5, c); g.globalAlpha = 1;
}
function smoke(g, t, x, y, c) { for (let i = 0; i < 3; i++) smokePuff(g, t, x, y, i, c); }
function post(g, t, on) {
  const b = B.post;
  walls(g, b, '#f3e0d0', '#c0503e', 6);
  windows(g, b, 2, on, t, b.y + 12);
  px(g, b.x + b.w - 6, b.y + b.h - 10, 5, 10, '#d0453a'); px(g, b.x + b.w - 6, b.y + b.h - 8, 5, 1, '#222');
  px(g, b.x + 6, b.y - 8, 1, 12, '#666'); px(g, b.x + 4, b.y - 8, 5, 1, '#666');
  if (on) {
    for (let r = 1; r <= 3; r++) if ((t / 220 | 0) % 4 >= r) { g.strokeStyle = '#ffd36a'; g.lineWidth = 1; g.beginPath(); g.arc(b.x + 6, b.y - 8, r * 3, -2.5, -0.6); g.stroke(); }
    const p = (t / 2400) % 1; // 편지 비둘기
    const x = b.x + 10 + p * 120, y = b.y - 6 - Math.sin(p * Math.PI) * 30;
    px(g, x, y, 5, 3, '#fff'); px(g, x + 1, y - 1 - ((t / 120 | 0) % 2), 3, 1, '#ddd');
  }
}
function site(g, t, on, edits, h) {
  const b = B.site, base = b.y + b.h - 4;
  px(g, b.x, base, b.w, 4, '#b38b5a');
  // 짓는 중인 건물: 수정할수록 층이 올라감
  const floors = Math.min(5, 1 + Math.floor(edits / 3)), fh = 5;
  for (let i = 0; i < floors; i++) {
    const y = base - (i + 1) * fh;
    px(g, b.x + 14, y, 28, fh - 1, i === floors - 1 && on ? mix('#c9b48f', '#efe4d0', (t / 600) % 1) : '#d9c8a5');
    for (let w = 0; w < 3; w++) px(g, b.x + 17 + w * 8, y + 1, 4, 2, '#5b7290');
  }
  const top = base - (floors + 1) * fh;
  g.strokeStyle = '#8a6a3a'; g.lineWidth = 1;
  for (let x = b.x + 12; x <= b.x + 44; x += 8) { g.beginPath(); g.moveTo(x + .5, top); g.lineTo(x + .5, base); g.stroke(); }
  // 크레인
  const cx = b.x + b.w - 8;
  px(g, cx, b.y - 8, 2, b.h + 4, '#e6b030'); px(g, cx - 34, b.y - 8, 44, 2, '#e6b030');
  const hx = cx - 10 - (on ? (Math.sin(t / 700) + 1) * 12 : 8), rope = on ? 10 + Math.sin(t / 500) * 4 : 6;
  px(g, hx, b.y - 6, 1, rope, '#444'); px(g, hx - 3, b.y - 6 + rope, 7, 3, ROOF[h % 8]);
  px(g, b.x + 2, base - 10, 10, 7, '#f2d24b'); text(g, '!', b.x + 5, base - 10, '#222', 6);
  if (on) for (let i = 0; i < 3; i++) if ((t / 90 + i * 7) % 10 < 3) px(g, b.x + 20 + i * 8 + (t / 50 % 3), top + 2 + i, 1, 1, '#ffef7a');
}
function inn(g, t, sleeping) {
  const b = B.inn;
  walls(g, b, '#e9d2b0', '#8a5a2a', 7);
  windows(g, b, 2, sleeping, t, b.y + 13);
  px(g, b.x + 4, b.y + 9, 13, 5, '#6b4a2b'); text(g, 'INN', b.x + 5, b.y + 9, '#f3e3b0', 4);
  px(g, b.x + b.w - 10, b.y - 2, 5, 8, '#8a5a2a');
  if (sleeping) for (let i = 0; i < 3; i++) { const p = ((t / 1800) + i / 3) % 1; g.globalAlpha = 1 - p; text(g, 'z', b.x + b.w - 8 + p * 8, b.y - 4 - p * 14, '#ffffff', 5 + i); g.globalAlpha = 1; }
}
function fountain(g, t) {
  const x = 104, y = ROAD_Y - 3;
  px(g, x - 10, y, 22, 7, '#9fb0c4'); px(g, x - 8, y + 1, 18, 4, '#6fb6e8');
  const p = (t / 200 | 0) % 3; px(g, x, y - 4 + p, 2, 4 - p, '#bfe3ff');
}
// 고친 파일 = 집. 많이 고칠수록 큰 집
function houses(g, t, list, bornAt) {
  const max = 12, n = Math.min(max, list.length), y = H - 24;
  const shown = list.slice(-max);
  for (let i = 0; i < n; i++) {
    const hs = shown[i], x = 8 + i * 19, c = ROOF[hash(hs.path) % 8];
    const born = bornAt.get(hs.path) || 0, age = born ? (performance.now() - born) / 500 : 9;
    const s = Math.min(1, age);
    const hh = Math.max(1, Math.round((8 + Math.min(6, hs.edits - 1)) * s));
    px(g, x + 2, y + 14 - hh, 12, hh, '#f3ead6');
    for (let r = 0; r < 4; r++) px(g, x + r, y + 14 - hh - r - 1, 16 - r * 2, 1, c);
    px(g, x + 6, y + 9, 4, 5, '#6b4a2b');
    if (hs.edits > 2) px(g, x + 3, y + 14 - hh + 2, 3, 3, '#ffe9a0');
    if (age < 3) { g.globalAlpha = Math.max(0, 1 - age / 3); text(g, '✨', x + 2, y - 8 - age * 3, '#fff', 7); g.globalAlpha = 1; }
  }
  if (list.length > max) text(g, `+${list.length - max}`, W - 14, y - 4, '#ffffff', 6);
}

// 사람: 크기 1 = 촌장(메인 Claude), 0.65 = 학생(서브에이전트)
function person(g, x, fy, shirt, hair, t, mode, dir, s, hat, backpack) {
  const P = (dx, dy, w, h, c) => px(g, x + dx * s, fy - dy * s, Math.max(1, Math.round(w * s)), Math.max(1, Math.round(h * s)), c);
  const step = mode === 'walk' ? ((t / 140 | 0) % 2) : 0;
  const bob = mode === 'work' || mode === 'study' ? ((t / 220 | 0) % 2) : mode === 'cheer' ? ((t / 160 | 0) % 2) * 2 : 0;
  P(0, 3, 2, 3 - step, '#2d3348'); P(4, 3, 2, 3 - (1 - step), '#2d3348');
  P(0, 8 + bob, 6, 5, shirt);
  if (backpack) P(dir > 0 ? -1 : 5, 7 + bob, 2, 4, '#d0453a');
  if (mode === 'wave') { const up = (t / 200 | 0) % 2; P(dir > 0 ? 6 : -2, 12 + (up ? 2 : 0) + bob, 2, 4, '#f1c7a0'); }
  else if (mode === 'cheer') { P(-2, 13 + bob, 2, 4, '#f1c7a0'); P(6, 13 + bob, 2, 4, '#f1c7a0'); }
  else P(dir > 0 ? 5 : -1, 6 + bob, 2, 2, '#f1c7a0');
  P(1, 13 + bob, 4, 5, '#f1c7a0'); P(1, 13 + bob, 4, 2, hair);
  P(dir > 0 ? 4 : 1, 11 + bob, 1, 1, '#222');
  if (hat) { P(0, 14 + bob, 6, 1, hat); P(1, 16 + bob, 4, 2, hat); }
  if (backpack) P(0, 14 + bob, 6, 1, '#3e78c0');
}

// 한 번씩 터지는 이벤트
function effectFx(g, t, f, h) {
  const a = (t - f.t0) / 1000;
  switch (f.kind) {
    case 'commit': { // 불꽃놀이
      if (a > 3) return false;
      for (let b = 0; b < 3; b++) {
        const bt = a - b * .6; if (bt < 0 || bt > 1.6) continue;
        const cx = 60 + ((f.seed * 37 + b * 61) % 120), cy = 14 + (b * 7) % 14, c = SHIRT[(f.seed + b) % 8];
        if (bt < .4) px(g, cx, cy + 30 * (1 - bt / .4), 1, 3, '#fff');
        else for (let i = 0; i < 12; i++) { const ang = i / 12 * Math.PI * 2, r = (bt - .4) * 22; g.globalAlpha = Math.max(0, 1 - (bt - .4)); px(g, cx + Math.cos(ang) * r, cy + Math.sin(ang) * r + (bt - .4) * 6, 2, 2, c); g.globalAlpha = 1; }
      }
      return true;
    }
    case 'push': { // 열기구 출발
      if (a > 7) return false;
      const x = 120 + Math.sin(a) * 10 + a * 6, y = ROAD_Y - a * 16;
      circle(g, x, y - 10, 7, ROOF[h % 8]); px(g, x - 1, y - 16, 2, 12, '#ffffff55');
      px(g, x - 3, y - 3, 1, 4, '#5b3a23'); px(g, x + 2, y - 3, 1, 4, '#5b3a23'); px(g, x - 3, y + 1, 6, 3, '#8a5a2a');
      return true;
    }
    case 'pr': { // 현수막 비행기
      if (a > 6) return false;
      const x = W + 10 - a * 50, y = 16;
      px(g, x, y, 10, 3, '#e6e6e6'); px(g, x + 3, y - 2, 3, 7, '#c8c8c8');
      px(g, x + 11, y + 1, 4, 1, '#888'); px(g, x + 15, y - 2, 26, 8, '#fff2a8'); text(g, 'PR!', x + 19, y - 1, '#b8476e', 6);
      return true;
    }
    case 'dawn': { // 컨텍스트 압축 = 새 날
      if (a > 2.5) return false;
      g.globalAlpha = Math.max(0, .8 - a / 3); px(g, 0, 0, W, H, '#fff6d8'); g.globalAlpha = 1;
      text(g, '새 날 🌅', W / 2, 40, '#a0522d', 10, 'center');
      return true;
    }
    default: return a < 2.5;
  }
}

// ── 화면 ───────────────────────────────────────────────────────────────────
const villages = new Map();
let data = { villages: [], cloud: {} };
const rank = { waiting: 0, working: 1, done: 2, failed: 2, idle: 3 };

function render() {
  const vs = data.villages, ids = new Set(vs.map((v) => v.id));
  for (const [id, vv] of villages) if (!ids.has(id)) { vv.el.remove(); villages.delete(id); }
  for (const v of vs) { const vv = villages.get(v.id); if (vv) vv.update(v); else villages.set(v.id, new Village(v)); }
  for (const where of ['local', 'cloud']) {
    const grid = where === 'local' ? gLocal : gCloud;
    const list = vs.filter((v) => v.where === where).sort((a, b) => (rank[a.status] - rank[b.status]) || (b.lastAt - a.lastAt));
    if (!list.length) {
      const msg = where === 'local' ? '최근 로컬 세션이 없어요.'
        : !data.cloud.enabled ? '구름 마을을 보려면 <code>node server.js --cloud</code> 로 실행하세요.'
        : data.cloud.error ? '⚠ ' + esc(data.cloud.error) : '최근 클라우드 세션이 없어요.';
      grid.innerHTML = `<div class="empty">${msg}</div>`;
    } else {
      grid.querySelector('.empty')?.remove();
      list.forEach((v, i) => { const el = villages.get(v.id).el; if (grid.children[i] !== el) grid.insertBefore(el, grid.children[i] || null); });
    }
  }
  hud();
  if (dlg.open && dlg.dataset.id) openDetail(dlg.dataset.id, true);
}

function loop(t) {
  for (const vv of villages.values()) {
    const r = vv.cv.getBoundingClientRect();
    if (r.bottom > 0 && r.top < innerHeight) vv.draw(t);
  }
  requestAnimationFrame(loop);
}

// ── 상단 / 알림 ─────────────────────────────────────────────────────────────
let notify = false; try { notify = localStorage.getItem('cv-notify') === '1'; } catch {}
const paintBell = () => (bell.textContent = notify ? '🔔 알림 켜짐' : '🔕 알림');
paintBell();
bell.onclick = async () => {
  notify = !notify;
  if (notify && 'Notification' in window && Notification.permission === 'default') { try { await Notification.requestPermission(); } catch {} }
  try { localStorage.setItem('cv-notify', notify ? '1' : '0'); } catch {}
  paintBell(); if (notify) ding();
};
let actx;
function ding() {
  try {
    actx = actx || new AudioContext();
    [988, 1319].forEach((f, i) => { const o = actx.createOscillator(), v = actx.createGain(); o.type = 'square'; o.frequency.value = f;
      const s = actx.currentTime + i * .12; v.gain.setValueAtTime(.05, s); v.gain.exponentialRampToValueAtTime(.0001, s + .15);
      o.connect(v).connect(actx.destination); o.start(s); o.stop(s + .16); });
  } catch {}
}
const seenWait = new Set(); let firstHud = true;
function hud() {
  const vs = data.villages, c = (f) => vs.filter(f).length;
  nLocal.textContent = c((v) => v.where === 'local'); nCloud.textContent = c((v) => v.where === 'cloud');
  nWork.textContent = c((v) => v.status === 'working'); nDone.textContent = c((v) => v.status === 'done');
  nStud.textContent = vs.reduce((a, v) => a + v.students.filter((s) => !s.done).length, 0);
  const waiting = vs.filter((v) => v.status === 'waiting');
  nWait.textContent = waiting.length;
  document.title = (waiting.length ? `(${waiting.length}) ❗ ` : '') + 'Claude Village';
  waitlist.style.display = waiting.length ? 'flex' : 'none';
  waitlist.replaceChildren(...waiting.map((v) => {
    const a = document.createElement('a');
    a.textContent = `${v.where === 'cloud' ? '☁️' : '💻'} ${clip(v.name, 16)} — ${clip(v.detail || v.note || v.title, 36)}`;
    if (v.url) { a.href = v.url; a.target = '_blank'; a.rel = 'noopener'; } else a.onclick = () => openDetail(v.id);
    return a;
  }));
  for (const v of waiting) if (!seenWait.has(v.id)) {
    seenWait.add(v.id);
    if (!firstHud && notify) { ding(); try { if (Notification.permission === 'granted') new Notification(`❗ ${v.name}`, { body: v.detail || v.note || v.title }); } catch {} }
  }
  for (const id of [...seenWait]) if (!waiting.some((v) => v.id === id)) seenWait.delete(id);
  firstHud = false;
}

// ── 상세 ───────────────────────────────────────────────────────────────────
dlgx.onclick = () => dlg.close();
dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
function openDetail(id, refresh) {
  const v = data.villages.find((x) => x.id === id); if (!v) return;
  const row = (k, val) => (val ? `<div class="row">${k}: <span>${esc(val)}</span></div>` : '');
  const ago = v.lastAt ? Math.round((Date.now() - v.lastAt) / 1000) : null;
  const kids = v.students.filter((s) => !s.done);
  dlgb.innerHTML = `<h3>${v.where === 'cloud' ? '☁️' : '💻'} ${esc(v.title)}</h3>`
    + row('상태', (STATUS[v.status] || STATUS.idle)[0]) + row('마을', v.name) + row('레포', v.repo) + row('브랜치', v.branch)
    + row('지금', v.status === 'working' ? `${B[v.building].label} — ${v.tool || ''} ${v.detail || ''}` : (v.detail || v.note))
    + row('하루', v.ctx ? `${timeIcon(v.ctx.pct)} 컨텍스트 ${Math.round(v.ctx.used / 1000)}k / ${Math.round(v.ctx.max / 1000)}k` : '')
    + row('마지막 활동', ago != null ? (ago < 60 ? `${ago}초 전` : ago < 3600 ? `${Math.round(ago / 60)}분 전` : `${Math.round(ago / 3600)}시간 전`) : '')
    + `<div class="row" style="margin-top:8px">🎓 학생 (서브에이전트) ${kids.length}</div>`
    + (kids.length ? `<ul>${kids.map((s) => `<li>${ICON[s.building]} <b>${esc(s.type)}</b> ${esc(s.desc)} ${s.tool ? `<span style="color:var(--dim)">· ${esc(shortTool(s.tool))} ${esc(s.detail)}</span>` : ''}</li>`).join('')}</ul>` : '')
    + `<div class="row">🏠 집(고친 파일) ${v.houses.length} · 수정 ${v.stats.edits} · 커밋 ${v.stats.commits} · 푸시 ${v.stats.pushes} · PR ${v.stats.prs}</div>`
    + (v.houses.length ? `<ul>${v.houses.slice(-15).reverse().map((h) => `<li>${esc(h.name)} <span style="color:var(--dim)">×${h.edits}</span></li>`).join('')}</ul>` : '')
    + (v.url ? `<div class="row"><a href="${esc(v.url)}" target="_blank" rel="noopener">claude.ai 에서 열기 ↗</a></div>` : '')
    + (v.resume ? `<div class="row">이어가기: <code>${esc(v.resume)}</code></div>` : '');
  dlg.dataset.id = id;
  if (!refresh) dlg.showModal();
}

// ── 폰으로 보기 (QR) ────────────────────────────────────────────────────────
fetch('/lan').then((r) => r.json()).then((j) => {
  if (!j.urls || !j.urls.length) return;
  phone.hidden = false;
  phone.onclick = async () => {
    dlg.dataset.id = '';
    const u = j.urls[0].url;
    dlgb.innerHTML = `<h3>📱 폰으로 보기</h3><div class="row">폰 카메라로 찍으세요. 노트북과 같은 와이파이(또는 Tailscale)에 있어야 해요.</div><div id="qr"></div>`
      + j.urls.map((l) => `<div class="row">${l.tailscale ? 'Tailscale' : esc(l.ifname)}: <a href="${esc(l.url)}">${esc(l.url)}</a></div>`).join('')
      + `<div class="row" style="margin-top:6px">⚠ 이 주소에는 접속 토큰이 들어 있어요. 아무 데나 공유하지 마세요.</div>`;
    dlg.showModal();
    try {
      if (!window.qrcode) await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
      const q = qrcode(0, 'M'); q.addData(u); q.make(); $('qr').innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
    } catch { $('qr').textContent = '(QR 을 못 불러왔어요. 아래 주소를 폰에 직접 입력하세요)'; }
  };
}).catch(() => {});

// ── 데이터 ─────────────────────────────────────────────────────────────────
function connect() {
  const es = new EventSource('/events');
  es.onopen = () => { conn.textContent = '● 실시간'; conn.style.color = 'var(--ok)'; };
  es.onmessage = (e) => { data = JSON.parse(e.data); if (data.demo) conn.textContent = '● 데모'; render(); };
  es.onerror = () => { conn.textContent = '○ 다시 연결 중'; conn.style.color = 'var(--warn)'; };
}
connect(); requestAnimationFrame(loop);
</script>
