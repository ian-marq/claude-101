<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3eee6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161b" media="(prefers-color-scheme: dark)">
<title>Claude Village</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M17 6l13 7.5-13 7.5L4 13.5z" fill="#9fd07c"/><path d="M4 13.5l13 7.5v6L4 19.5z" fill="#b48057"/><path d="M30 13.5L17 21v6l13-7.5z" fill="#94643f"/><path d="M13 9.5l5 2.9v5.4l-5-2.9z" fill="#f4ede2"/><path d="M18 12.4l3-1.7v5.4l-3 1.7z" fill="#d9cfc0"/><path d="M12.4 9.2L15.5 5l5.4 5.6-2.9 1.7z" fill="#d86b4f"/></svg>
      <div style="min-width:0"><h1>Claude Village</h1><p id="summary">연결 중…</p></div>
    </div>
    <button class="icon-btn" id="legend" title="마을에서 일어나는 일"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 015.8 1c0 2-3 3-3 3M12 17h.01"/></svg><span>범례</span></button>
    <a class="icon-btn" href="kit.html" title="에셋 키트"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>키트</span></a>
    <button class="icon-btn" id="phone" hidden title="폰으로 보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg><span>폰</span></button>
    <button class="icon-btn" id="bell" title="나를 기다리는 마을이 생기면 알림"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 003.4 0"/></svg></button>
    <span class="live" id="live" title="연결 상태"></span>
  </div>
  <div id="waitlist"></div>
</header>
<main>
  <div class="section"><h2>내 노트북</h2><span id="cLocal"></span></div>
  <div class="grid" id="gLocal"></div>
  <div class="section"><h2>클라우드</h2><span id="cCloud">claude.ai/code</span></div>
  <div class="grid" id="gCloud"></div>
</main>
<dialog id="dlg"><button class="close" id="dlgx" aria-label="닫기">✕</button><div class="sheet" id="dlgb"></div></dialog>
<script src="iso.js"></script>
<script src="kit.js"></script>
<script src="people.js"></script>
<script src="village.js"></script>
<script src="app.js"></script>
</body>
</html>
